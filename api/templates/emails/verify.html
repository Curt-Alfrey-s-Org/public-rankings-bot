<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; background-color: white; padding: 20px; border-radius: 8px; }
        h2 { color: #333; }
        p { color: #666; font-size: 16px; }
        a { background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .footer { color: #999; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to Example Organization!</h2>
        <p>Please verify your email address:</p>
        <p><a href="{{ verification_url }}">Verify Email</a></p>
        <div class="footer">
            <p>This link expires in 24 hours.</p>
            <p>If you didn't create this account, please ignore this email.</p>
        </div>
    </div>
</body>
</html>
