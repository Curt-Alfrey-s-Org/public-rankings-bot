# PostgreSQL performance tuning for Rankings Bot
# For hosts with 6+ cores and 32GB RAM.
# Applied via docker-compose command (see docker-compose.yml).
# Reference only; actual tuning is in docker-compose postgres command.
#
# References: PostgreSQL tuning docs, Twelve-Factor config via env/files

shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 64MB
maintenance_work_mem = 512MB
max_connections = 100
random_page_cost = 1.1
