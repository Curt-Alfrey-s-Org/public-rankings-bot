# Nginx config for Rankings-Bot when using Cloudflare (no certs on origin)
# Cloudflare terminates SSL; connection from Cloudflare to this server is HTTP (Flexible or "Full" with HTTP).
# Use this file so you don't need Let's Encrypt or any certs on the server.
# Place in /etc/nginx/sites-available/rankings-bot, enable, then: sudo nginx -t && sudo systemctl reload nginx

upstream rankings_bot {
    server 127.0.0.1:8003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name probilliardssoftware.com www.probilliardssoftware.com;

    # Trust Cloudflare headers so the app sees correct proto/host
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/rankings-bot-access.log;
    error_log /var/log/nginx/rankings-bot-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Security headers (Cloudflare may add others)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://rankings_bot/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /ws {
        proxy_pass http://rankings_bot/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        error_page 404 =200 /index.html;
    }

    location = /index.html {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Branding assets (ALFa avatar) - short cache, not immutable
    location ^~ /branding/ {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}
