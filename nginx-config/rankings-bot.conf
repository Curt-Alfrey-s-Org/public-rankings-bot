# Nginx Reverse Proxy Configuration for Rankings-Bot
# Place this in /etc/nginx/sites-available/rankings-bot
# Then create symlink: sudo ln -s /etc/nginx/sites-available/rankings-bot /etc/nginx/sites-enabled/rankings-bot
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# API serves both SPA (/) and API (/api) - single backend
# 127 here: Nginx and API on same host; use host IP if API is on another host
upstream rankings_bot {
    server 127.0.0.1:8003;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name probilliardssoftware.com;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name probilliardssoftware.com;
    
    # SSL Configuration (assuming certbot-managed certs)
    ssl_certificate /etc/letsencrypt/live/probilliardssoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probilliardssoftware.com/privkey.pem;
    
    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Logging
    access_log /var/log/nginx/rankings-bot-access.log;
    error_log /var/log/nginx/rankings-bot-error.log;
    
    # Compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;
    
    # API Routes
    location /api/ {
        proxy_pass http://rankings_bot/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket Support for Real-time Features
    location /ws {
        proxy_pass http://rankings_bot/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable timeouts for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # Frontend + SPA (API serves index.html and /assets)
    location / {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ensure HTML is not cached so updates show after deploy (including incognito)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # Single Page Application routing
        error_page 404 =200 /index.html;
    }

    # Don't cache HTML so new deploys show immediately
    location = /index.html {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Hashed assets can be cached long (Vite uses content hashes in filenames)
    # Branding assets (ALFa avatar) - short cache, not immutable
    location ^~ /branding/ {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://rankings_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}
