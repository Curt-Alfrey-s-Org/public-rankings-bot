# Main site = static maintenance page only. Switch to production with: ./scripts/switch-site.sh production
# Tunnel (cf-probilliards) routes to this container.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream rankings_bot_api {
    server rankings-bot-api:8003;
    keepalive 24;
}

# ---------------------------------------------------------------------------
# Main site — static maintenance page only
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name probilliardssoftware.com www.probilliardssoftware.com;

    root /var/www/maintenance;
    index index.html;
    access_log /var/log/nginx/rankings-bot-access.log;
    error_log /var/log/nginx/rankings-bot-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}

# ---------------------------------------------------------------------------
# Local / fallback ingress: same proxy rules as production (live app). Public www
# still uses the static maintenance server above; tunnel Host: localhost / unknown uses this block.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 _;

    set $backend_rankings rankings-bot-api:8003;
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/rankings-bot-access.log;
    error_log /var/log/nginx/rankings-bot-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://rankings_bot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws {
        proxy_pass http://$backend_rankings/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /assets/video/ {
        proxy_pass http://$backend_rankings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control "private, no-cache, must-revalidate" always;
    }

    # ALFa avatar at a stable URL; must not get immutable 1y (Cloudflare/browser keep stale PNG after replace).
    location ^~ /branding/ {
        proxy_pass http://$backend_rankings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location / {
        proxy_pass http://$backend_rankings;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        error_page 404 =200 /index.html;
    }

    location = /index.html {
        proxy_pass http://$backend_rankings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$backend_rankings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}

# app.probilliardssoftware.com — mobile/app subdomain (API proxy matches production)
server {
    listen 80;
    listen [::]:80;
    server_name app.probilliardssoftware.com;

    set $backend_rankings rankings-bot-api:8003;
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    root /var/www/mobile-app;
    index index.html;

    location /api/ {
        proxy_pass http://rankings_bot_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /branding/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
