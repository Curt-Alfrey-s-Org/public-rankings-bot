# USPBF Nginx — maintenance: www / apex show static page; app.example.com unchanged.
# Switch to production: ./scripts/switch-site.sh production
# Tunnel (cf-uspbf) routes to http://uspbf-nginx:80

resolver 127.0.0.11 valid=10s ipv6=off;

# rankings-bot-api is addressed through the $backend_rankings variable (set per server) and
# resolved at request time via the Docker DNS resolver above. A static `upstream` block made
# nginx refuse to start (and take example.com down) whenever rankings-bot-api was not running;
# now nginx starts and /api/ returns 502 until the API is back (security review 2026-09-25).

# Anonymous /api/ allowlist for the static marketing site ($uspbf_public_api_allowed).
include /etc/nginx/snippets/uspbf-public-api-allowlist.conf;

# ---------------------------------------------------------------------------
# Public main site — static maintenance only
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;

    set $backend_rankings rankings-bot-api:8003;

    root /var/www/maintenance;
    index index.html;
    access_log /var/log/nginx/uspbf-wp-access.log;
    error_log /var/log/nginx/uspbf-wp-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Live WebSocket to API (marketing static bundle may still connect during maintenance)
    location /ws {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host app.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }


    # Public (anonymous) API for the static pages: allowlisted endpoints only, server-side
    # BOT_API_KEY injected by nginx. See snippets/uspbf-public-api-allowlist.conf.
    location /api/ {
        include /etc/nginx/snippets/uspbf-public-api-proxy.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}

# ---------------------------------------------------------------------------
# Local / fallback: WordPress (same as production main site) for LAN checks
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 _;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/uspbf-wp-local-access.log;
    error_log /var/log/nginx/uspbf-wp-local-error.log;

    client_max_body_size 50M;

    location / {
        set $backend_wp uspbf_wordpress_1:80;
        proxy_pass http://$backend_wp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ---------------------------------------------------------------------------
# App subdomain — unchanged in maintenance mode
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    set $backend_rankings rankings-bot-api:8003;
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/uspbf-app-access.log;
    error_log /var/log/nginx/uspbf-app-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ^~: API paths ending in .png/.js/... (e.g. /api/assets/serve/*.png) must stay here,
    # not fall into the 1-year "immutable" static-file regex below (review 2026-09-26).
    location ^~ /api/ {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws {
        proxy_pass http://$backend_rankings/ws;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        error_page 404 =200 /index.html;
    }

    location = /index.html {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }


    location ^~ /branding/ {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # PWA service worker + its registration script keep fixed (unhashed) names. The
    # static-file regex below would mark them "public, immutable" for a year, so browsers and
    # Cloudflare could keep serving an old app shell after a deploy (review 2026-09-26).
    location ~ ^/(sw|registerSW)\.js$ {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, max-age=0" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}

# ---------------------------------------------------------------------------
# LAN preview: static site + /api/ on :8089 (host maps 8089:8089). No Host header required.
# ---------------------------------------------------------------------------
server {
    listen 8089;
    listen [::]:8089;
    server_name _;

    set $backend_rankings rankings-bot-api:8003;

    root /var/www/site;
    index index.html;

    access_log /var/log/nginx/uspbf-site-preview-access.log;
    error_log /var/log/nginx/uspbf-site-preview-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Public (anonymous) API for the static pages: allowlisted endpoints only, server-side
    # BOT_API_KEY injected by nginx. See snippets/uspbf-public-api-allowlist.conf.
    location /api/ {
        include /etc/nginx/snippets/uspbf-public-api-proxy.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://$backend_rankings;
        include /etc/nginx/snippets/strip-client-auth-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host app.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
}

# ---------------------------------------------------------------------------
# Health check (for Docker HEALTHCHECK)
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name localhost;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
