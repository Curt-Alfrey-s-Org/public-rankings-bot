# USPBF — drop client-supplied trust headers before proxying to rankings-bot-api.
# X-User-Role and X-API-Key are only meaningful when set by this proxy (see
# bot-api-key-headers.conf for the static-site allowlist). rankings-bot-api falls back
# to X-User-Role when no Bearer token is sent, so a browser/curl-supplied value must never
# reach it (security review 2026-09-25). An empty value makes nginx omit the header.
# Include in every location that proxies to rankings-bot-api (except the static-site
# /api/ location, which overrides both headers via bot-api-key-headers.conf).
proxy_set_header X-User-Role "";
proxy_set_header X-API-Key "";
