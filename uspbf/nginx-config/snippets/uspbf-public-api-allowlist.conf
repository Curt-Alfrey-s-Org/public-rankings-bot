# USPBF — anonymous /api/ allowlist for the static marketing site (example.com, www, LAN :8089).
# Included once at http level by uspbf-nginx-production.conf / uspbf-nginx-maintenance.conf.
#
# Why: the static-site /api/ proxy injects the server-side BOT_API_KEY (and X-User-Role: user)
# into every request it forwards. Without an allowlist that turned example.com/api/* into an
# anonymous, key-bearing gateway to the WHOLE rankings-bot API (security review 2026-09-25).
# Only the read-only endpoints the marketing pages actually call (nginx-config/site/js/*.js,
# nginx-config/maintenance/js/*.js) plus the public ALFa demo chat are forwarded; everything
# else returns 404 without reaching rankings-bot-api. Signed-in features live on app.example.com.
#
# Key: "<METHOD>:<normalized $uri>". GET also admits HEAD. Add new public endpoints here
# (and a test in tests/nginx/run.sh) when the static site starts calling them.
map "$request_method:$uri" $uspbf_public_api_allowed {
    default 0;
    "~^(GET|HEAD):/api/login-features$"                                      1;
    "~^(GET|HEAD):/api/news$"                                                1;
    "~^(GET|HEAD):/api/rankings/player-names$"                               1;
    "~^(GET|HEAD):/api/rankings/player/[^/]+$"                               1;
    "~^(GET|HEAD):/api/rankings/(wpba-women|wpa-women|wpa-men|wpa-heyball-men|wpa-heyball-women|fargo-global|wpa-artistic|cp-9ball|cp-10ball|cp-8ball)$" 1;
    "~^(GET|HEAD):/api/tournament-history/(upcoming|years|leaderboard-results|search|tournaments)$" 1;
    "POST:/api/ai-narrative/demo-ask"                                        1;
}
