# USPBF — proxy settings for the static-site /api/ location (example.com, www, LAN :8089).
# Included inside `location /api/ { ... }`; the including location must also set
# X-Forwarded-Proto. Requires $uspbf_public_api_allowed (uspbf-public-api-allowlist.conf)
# and $backend_rankings (set at server level).

default_type application/json;

# Refuse raw request paths that nginx would normalize differently from the backend
# (dot segments, encoded slashes/dots/backslashes, doubled slashes), so the allowlist
# below cannot be bypassed with e.g. /api/rankings/player/..%2F..%2Fadmin.
if ($request_uri ~* "^[^?]*(\.\.|%2e|%2f|%5c|\x5c|//)") {
    return 400 '{"detail":"Bad request"}';
}

# Only the endpoints the public marketing pages use are forwarded (see allowlist snippet).
if ($uspbf_public_api_allowed = 0) {
    return 404 '{"detail":"Not found"}';
}

# Server-side BOT_API_KEY + fixed X-User-Role: user (generated at container start by
# docker-entrypoint.d/99-uspbf-bot-api-key.sh). These replace any client-sent values.
include /etc/nginx/snippets/bot-api-key-headers.conf;

proxy_pass http://$backend_rankings;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_method $request_method;
proxy_set_header Host app.example.com;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The public site never authenticates; do not mix a visitor's credentials with the
# server-side API key.
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
add_header Cache-Control "no-store, no-cache, must-revalidate" always;
