# Alembic Configuration File
# Generated for bot authentication database migrations

# Logging configuration
[loggers]
keys = sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
script_location = alembic
script_kind = plain
prepend_sys_path = .
# Use same DB as app; override with DATABASE_URL in env (see database/__init__.py)
sqlalchemy.url = postgresql://rankingsbot_user:PASSWORD@rankings-bot-postgres:5432/rankingsbot
migrate_empty_slices = false
sqlalchemy.track_modifications = false
